name: Issues

on:
  issues:
    types: [opened, labeled]

permissions:
  # Auto hash fixing via direct commit
  contents: write
  # Auto hash fixing via pull request
  pull-requests: write
  # Required for commenting on issues
  issues: write

jobs:
  issueHandler:
    name: IssueHandler
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: IssueHandler
        uses: ScoopInstaller/GithubActions@main
        if:
          github.event.action == 'opened' || (github.event.action == 'labeled' &&
          contains(github.event.issue.labels.*.name, 'verify'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
